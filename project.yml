name: AppCurtain
options:
  deploymentTarget:
    iOS: "13.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    DEAD_CODE_STRIPPING: YES
targets:
  AppCurtain:
    type: framework
    platform: iOS
    sources:
      - path: Sources/AppCurtain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AppCurtain
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
