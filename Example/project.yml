name: AppCurtainExample
options:
  deploymentTarget:
    iOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 5.9
packages:
  AppCurtain:
    path: ..
targets:
  AppCurtainExample:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - README.md
          - project.yml
    dependencies:
      - package: AppCurtain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AppCurtainExample
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Info.plist
